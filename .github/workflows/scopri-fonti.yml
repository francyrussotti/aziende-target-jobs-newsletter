name: 🔎 Aziende Target - cerca fonti

# Cerca per ogni azienda della lista un portale di selezione con API pubblica
# (scopri_fonti.py) e aggiorna dati/fonti.json. Una volta a settimana
# o a mano. Quando cambia dati/aziende.json (routine giornaliera che importa la
# lista dalla pagina) aggiorna i siti CORDIS e cerca solo le aziende nuove.
on:
  schedule:
    - cron: "13 2 * * 1"
  push:
    branches: [main]
    paths: [dati/aziende.json]
  workflow_dispatch:
    inputs:
      solo_focus:
        description: "Solo aziende Parigi / Italia / open innovation / classe A"
        type: boolean
        default: false
      aziende:
        description: "Solo questi ID, separati da spazio (vuoto = tutte)"
        default: ""
      diagnosi:
        description: "Solo diagnosi (stampa cosa vede per gli ID indicati, non salva)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: newsletter   # mai in parallelo con la newsletter (stessi file)
  cancel-in-progress: false

jobs:
  scopri:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - name: Install Playwright + Chromium
        # Serve per Welcome to the Jungle (risponde 202 anti-bot alle richieste dirette)
        run: playwright install chromium
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: sudo $(which playwright) install-deps chromium
      - name: Siti ufficiali da CORDIS (se mancano o se è cambiata la lista)
        run: |
          if [ ! -f dati/siti.json ]; then python -u siti.py
          elif [ "${{ github.event_name }}" = "push" ]; then python -u siti.py || echo "⚠️ CORDIS non raggiunto: siti invariati"
          fi
      - name: Ricerca
        env:
          AZIENDE: ${{ inputs.aziende }}
        run: |
          ARGS=""
          for i in $AZIENDE; do ARGS="$ARGS --id $i"; done
          if [ "${{ github.event_name }}" = "push" ]; then ARGS="$ARGS --nuove"; fi
          python -u scopri_fonti.py ${{ inputs.solo_focus && '--focus' || '' }} ${{ inputs.diagnosi && '--diagnosi' || '' }} $ARGS
      - name: Commit fonti
        if: always()   # salva anche i risultati parziali
        run: |
          set -e
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          for f in dati/fonti.json dati/siti.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --staged --quiet; then echo "Nessuna modifica"; exit 0; fi
          git commit -m "aziende target: aggiorna fonti"
          for tentativo in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash
          done
          exit 1
