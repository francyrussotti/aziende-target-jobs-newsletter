name: 🔎 Aziende Target - cerca fonti

# Cerca per ogni azienda della lista un portale di selezione con API pubblica
# (scopri_fonti.py) e aggiorna dati/fonti.json. Una volta a settimana
# o a mano (es. dopo aver aggiornato dati/aziende.json).
on:
  schedule:
    - cron: "13 2 * * 1"
  workflow_dispatch:
    inputs:
      solo_focus:
        description: "Solo aziende Parigi / Italia / open innovation / classe A"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: newsletter   # mai in parallelo con la newsletter (stessi file)
  cancel-in-progress: false

jobs:
  scopri:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 lxml
      - run: python -u scopri_fonti.py ${{ inputs.solo_focus && '--focus' || '' }}
      - name: Commit fonti
        if: always()   # salva anche i risultati parziali
        run: |
          set -e
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          [ -f dati/fonti.json ] || exit 0
          git add dati/fonti.json
          if git diff --staged --quiet; then echo "Nessuna modifica"; exit 0; fi
          git commit -m "aziende target: aggiorna fonti"
          for tentativo in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash
          done
          exit 1
